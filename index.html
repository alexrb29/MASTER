<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Auditoría de Ventas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 40px; background: #f0f2f5; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #1a202c; text-align: center; margin-bottom: 30px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .card h3 { margin: 0 0 10px 0; color: #718096; font-size: 1rem; text-transform: uppercase; }
        .card .value { font-size: 1.8rem; font-weight: bold; color: #2b6cb0; }
        .table-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 14px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background-color: #2b6cb0; color: white; }
        tr:hover { background-color: #f7fafc; }
        .footer { text-align: center; margin-top: 30px; color: #a0aec0; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Dashboard: Auditoría de Ventas</h1>
        
        <div class="cards-grid" id="cards-container">
            <div class="card">
                <h3>Cargando...</h3>
            </div>
        </div>

        <div class="table-card">
            <h3>Ventas (orden del archivo CSV)</h3>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Fecha</th><th>Producto</th><th>Categoría</th><th>Unidades</th><th>Precio unitario</th><th>Ingreso</th></tr></thead>
                    <tbody id="tabla-ventas"><tr><td colspan="7">Cargando datos...</td></tr></tbody>
                </table>
            </div>
        </div>
        <div class="table-card" style="margin-top: 20px">
            <h3>Ingresos por Categoría</h3>
            <table>
                <thead>
                    <tr>
                        <th>Categoría</th>
                        <th>Ingresos</th>
                    </tr>
                </thead>
                <tbody id="tabla-categorias">
                    <tr><td colspan="2">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer" id="footer-info"></div>
    </div>

    <script>
        async function cargarResumen() {
            try {
                // Leemos el archivo JSON generado por tu script ETL
                const respuesta = await fetch('./salida/resumen.json');
                const data = await respuesta.json();
                const ventasRespuesta = await fetch('./salida/ventas.json');
                const ventas = await ventasRespuesta.json();

                // Pintamos las tarjetas con los datos reales
                document.getElementById('cards-container').innerHTML = `
                    <div class="card">
                        <h3>Operaciones Válidas</h3>
                        <div class="value">${data.operaciones_validas}</div>
                    </div>
                    <div class="card">
                        <h3>Unidades Totales</h3>
                        <div class="value">${data.unidades_totales}</div>
                    </div>
                    <div class="card">
                        <h3>Ingresos Totales</h3>
                        <div class="value">${data.ingresos_totales.toLocaleString()} ${data.moneda}</div>
                    </div>
                `;

                // Pintamos la tabla con los ingresos por categoría
                const tbody = document.getElementById('tabla-categorias');
                tbody.innerHTML = '';
                data.ingresos_por_categoria.forEach(cat => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${cat.categoria}</strong></td>
                            <td>${cat.ingresos.toLocaleString()} ${data.moneda}</td>
                        </tr>
                    `;
                });

                document.getElementById('tabla-ventas').innerHTML = ventas.map(venta => `
                    <tr><td>${venta.venta_id}</td><td>${venta.fecha}</td><td>${venta.nombre}</td><td>${venta.categoria}</td><td>${venta.unidades}</td><td>${venta.precio_unitario.toLocaleString()} ${data.moneda}</td><td>${venta.ingreso.toLocaleString()} ${data.moneda}</td></tr>
                `).join('');

                document.getElementById('footer-info').innerText = `Periodo analizado: ${data.periodo.desde} al ${data.periodo.hasta} | Generado: ${new Date(data.generado_en).toLocaleString()}`;
            } catch (error) {
                console.error(error);
                document.getElementById('cards-container').innerHTML = `<div class="card" style="color:red;" colspan="3">Error al cargar 'salida/resumen.json'. Asegúrate de haber ejecutado el script ETL.</div>`;
            }
        }

        cargarResumen();
    </script>
</body>
</html>
